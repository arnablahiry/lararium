# Builds the Windows app (desktop/, the same code as the Mac app) into an .msi installer and publishes it as a release
# (not marked "latest", so the phone's in-app updates keep finding the APK). Uses the same two secrets as the Mac app:
#   MAC_GOOGLE_CLIENT_ID      the "Desktop app" OAuth client ID (same Google Cloud project as the phone)
#   MAC_GOOGLE_CLIENT_SECRET  its client secret
name: Build Windows app
on:
  push:
    branches: [main]
    paths:
      - "desktop/**"
      - "app/src/main/java/com/familydocs/app/domain/**"
      - "app/src/main/java/com/familydocs/app/data/Entities.kt"
      - "app/src/main/java/com/familydocs/app/ocr/FieldMerge.kt"
      - "app/src/main/java/com/familydocs/app/backup/BackupCrypto.kt"
      - "app/src/main/java/com/familydocs/app/backup/DriveClient.kt"
      - "app/src/main/java/com/familydocs/app/ui/ds/IconPaths.kt"
      - ".github/workflows/build-windows.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  msi:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v6
      - name: Build the .msi
        env:
          MAC_GOOGLE_CLIENT_ID: ${{ secrets.MAC_GOOGLE_CLIENT_ID }}
          MAC_GOOGLE_CLIENT_SECRET: ${{ secrets.MAC_GOOGLE_CLIENT_SECRET }}
          MAC_VERSION: 1.0.${{ github.run_number }}
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew -p desktop --no-daemon packageMsi 2>&1 | tee build.log
      - name: Summarise build errors (shown on the run page, no sign-in needed)
        if: failure()
        run: |
          grep -E -A4 '^e: |What went wrong|FAILED|error:' build.log | head -150 > errs.txt || true
          [ -s errs.txt ] || tail -60 build.log > errs.txt
          echo "::error title=Build errors::$(sed 's/%/%25/g; s/\r//g' errs.txt | awk '{printf "%s%%0A", $0}')"
      - name: Name the .msi
        run: |
          V=1.0.${{ github.run_number }}
          echo "V=$V" >> $GITHUB_ENV
          f=$(ls desktop/build/compose/binaries/main/msi/*.msi | head -1)
          cp "$f" "Lararium-windows-$V.msi"; cp "$f" Lararium-windows.msi
          { echo "Lararium for Windows $V. View-only for now: everything in your vault, read from your encrypted Google Drive backup and your group's shares. Add and change things on the phone."
            echo
            echo "Install: run the .msi (no administrator rights needed). Windows may warn that it doesn't know the publisher (the app isn't signed with a paid certificate): click More info, then Run anyway."
          } > win-notes.md
      - uses: actions/upload-artifact@v7
        with:
          name: Lararium-windows
          path: Lararium-windows-*.msi
      - name: "Publish (not as the latest release, which stays the phone APK)"
        uses: softprops/action-gh-release@v3
        with:
          tag_name: windows-v${{ env.V }}
          name: Lararium for Windows ${{ env.V }}
          make_latest: false
          files: |
            Lararium-windows-*.msi
            Lararium-windows.msi
          body_path: win-notes.md
      - name: "The newest .msi under a fixed link (the website's Download for Windows)"
        uses: softprops/action-gh-release@v3
        with:
          tag_name: windows
          name: Lararium for Windows (newest)
          make_latest: false
          overwrite_files: true
          files: Lararium-windows.msi
          body_path: win-notes.md
