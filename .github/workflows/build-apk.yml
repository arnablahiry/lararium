# Builds a signed release APK on every push to main (and on demand from the Actions tab).
# Needs these repository secrets (Settings → Secrets and variables → Actions):
#   KEYSTORE_BASE64     base64 of familydocs-release.jks
#   KEYSTORE_PASSWORD   the store/key password from keystore.properties
#   GOOGLE_WEB_CLIENT_ID  the OAuth web client ID (optional; sign-in/backup need it)
name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      versionCode: { description: "versionCode (must be higher than the installed one)", required: false }
      versionName: { description: "versionName, e.g. 0.2.0", required: false }

permissions:
  contents: write   # lets the workflow publish the APK as a Release you can download on your phone

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
      - name: Make gradlew runnable (lost when files are uploaded through the website)
        run: chmod +x gradlew
      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > familydocs-release.jks
          printf "storeFile=familydocs-release.jks\nstorePassword=%s\nkeyAlias=familydocs\nkeyPassword=%s\n" "$KEYSTORE_PASSWORD" "$KEYSTORE_PASSWORD" > keystore.properties
      - name: Google client ID
        env:
          CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
        run: |
          if [ -n "$CLIENT_ID" ]; then sed -i "s/REPLACE_ME.apps.googleusercontent.com/$CLIENT_ID/" app/src/main/res/values/strings.xml; fi
      - name: Cache Robolectric's Android jars (the database upgrade test)
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-${{ hashFiles('gradle/libs.versions.toml') }}
      - name: Test and build
        run: |
          VC="${{ github.event.inputs.versionCode }}"; VN="${{ github.event.inputs.versionName }}"
          set -o pipefail
          ./gradlew --continue testDebugUnitTest assembleRelease ${VC:+-Pfamilydocs.versionCode=$VC} ${VN:+-Pfamilydocs.versionName=$VN} 2>&1 | tee build.log
      - name: Summarise build errors (shown on the run page, no sign-in needed)
        if: failure()
        run: |
          grep -E -A4 '^e: |What went wrong|FAILED|error:' build.log | head -150 > errs.txt || true
          [ -s errs.txt ] || tail -60 build.log > errs.txt
          echo "::error title=Build errors::$(sed 's/%/%25/g; s/\r//g' errs.txt | awk '{printf "%s%%0A", $0}')"
      - name: Keep the database schema (app/schemas) in the repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Room writes it under app/build; the repository keeps one copy per version (an existing one is never changed)
          d=app/schemas/com.familydocs.app.data.AppDatabase; mkdir -p $d
          find app/build -path '*com.familydocs.app.data.AppDatabase/*.json' | while read -r f; do [ -f "$d/$(basename "$f")" ] || cp "$f" "$d/"; done
          git add app/schemas 2>/dev/null || true
          git diff --cached --quiet || { git commit -q -m "Database schema $(grep '^familydocs.versionName' gradle.properties | cut -d= -f2)"; git pull --rebase -q && git push -q || echo "couldn't push the schema (it's added next time)"; }
      - name: Name the APK
        run: |
          VN="${{ github.event.inputs.versionName }}"
          if [ -z "$VN" ]; then VN=$(grep '^familydocs.versionName' gradle.properties | cut -d= -f2); fi
          echo "VN=$VN" >> $GITHUB_ENV
          cp app/build/outputs/apk/release/app-release.apk "Lararium-$VN.apk"
          # the same file under a fixed name: .../releases/latest/download/Lararium.apk is always the newest one
          cp app/build/outputs/apk/release/app-release.apk Lararium.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Lararium-release-apk
          path: Lararium-*.apk
      - name: Release notes (this version's section of app/src/main/assets/changelog.txt)
        run: |
          awk -v v="## $VN" '$0==v{on=1;next} /^## /{on=0} on && /^- /' app/src/main/assets/changelog.txt > notes.txt
          { if [ -s notes.txt ]; then echo "What's new:"; cat notes.txt; echo; fi
            echo "Signed release APK. On the phone, open this page, download the .apk and tap it. If Lararium is already installed it updates in place and keeps everything."; } > release-notes.md
          cat release-notes.md
      - name: Publish as a Release (open this page on the phone to install)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VN }}-build${{ github.run_number }}
          name: Lararium ${{ env.VN }} (build ${{ github.run_number }})
          files: |
            Lararium-*.apk
            Lararium.apk
          body_path: release-notes.md
