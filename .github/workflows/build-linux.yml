# Builds the Linux app (desktop/, the same code as the Mac and Windows apps) as .deb, .rpm and a plain .tar.gz, and
# publishes them as a release
# (not marked "latest", so the phone's in-app updates keep finding the APK). Uses the same two secrets as the Mac app:
#   MAC_GOOGLE_CLIENT_ID      the "Desktop app" OAuth client ID (same Google Cloud project as the phone)
#   MAC_GOOGLE_CLIENT_SECRET  its client secret
name: Build Linux app
on:
  push:
    branches: [main]
    paths:
      - "desktop/**"
      - "app/src/main/java/com/familydocs/app/domain/**"
      - "app/src/main/java/com/familydocs/app/data/Entities.kt"
      - "app/src/main/java/com/familydocs/app/ocr/FieldMerge.kt"
      - "app/src/main/java/com/familydocs/app/backup/BackupCrypto.kt"
      - "app/src/main/java/com/familydocs/app/backup/DriveClient.kt"
      - "app/src/main/java/com/familydocs/app/ui/ds/IconPaths.kt"
      - "app/src/main/assets/changelog.txt"
      - ".github/workflows/build-linux.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v6
      - name: Tools for the .rpm
        run: sudo apt-get update -qq && sudo apt-get install -y -qq rpm
      - name: Build the .deb, .rpm and app folder
        env:
          MAC_GOOGLE_CLIENT_ID: ${{ secrets.MAC_GOOGLE_CLIENT_ID }}
          MAC_GOOGLE_CLIENT_SECRET: ${{ secrets.MAC_GOOGLE_CLIENT_SECRET }}
          MAC_VERSION: 1.0.${{ github.run_number }}
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew -p desktop --no-daemon packageDeb packageRpm createDistributable 2>&1 | tee build.log
      - name: Summarise build errors (shown on the run page, no sign-in needed)
        if: failure()
        run: |
          grep -E -A4 '^e: |What went wrong|FAILED|error:' build.log | head -150 > errs.txt || true
          [ -s errs.txt ] || tail -60 build.log > errs.txt
          echo "::error title=Build errors::$(sed 's/%/%25/g; s/\r//g' errs.txt | awk '{printf "%s%%0A", $0}')"
      - name: Name the files
        run: |
          V=1.0.${{ github.run_number }}
          echo "V=$V" >> $GITHUB_ENV
          d=desktop/build/compose/binaries/main
          cp "$(ls $d/deb/*.deb | head -1)" "Lararium-linux-$V.deb"; cp "Lararium-linux-$V.deb" Lararium-linux.deb
          cp "$(ls $d/rpm/*.rpm | head -1)" "Lararium-linux-$V.rpm"; cp "Lararium-linux-$V.rpm" Lararium-linux.rpm
          tar -C "$d/app" -czf "Lararium-linux-$V.tar.gz" Lararium; cp "Lararium-linux-$V.tar.gz" Lararium-linux.tar.gz
          { echo "Lararium for Linux $V (x86-64). Everything in your vault, read from your encrypted Google Drive backup and your group's shares; add and change things here and your phone takes them over. Later versions install from Settings › About."
            echo
            echo "Install: Ubuntu / Debian: sudo apt install ./Lararium-linux.deb · Fedora / openSUSE: sudo dnf install ./Lararium-linux.rpm · anything else: unpack the .tar.gz and run Lararium/bin/Lararium."
            echo "Your Google sign-in is kept in the desktop's keyring (secret-tool, from libsecret-tools) when there is one."
          } > linux-notes.md
      - uses: actions/upload-artifact@v7
        with:
          name: Lararium-linux
          path: |
            Lararium-linux-*.deb
            Lararium-linux-*.rpm
            Lararium-linux-*.tar.gz
      - name: "Publish (not as the latest release, which stays the phone APK)"
        uses: softprops/action-gh-release@v3
        with:
          tag_name: linux-v${{ env.V }}
          name: Lararium for Linux ${{ env.V }}
          make_latest: false
          files: |
            Lararium-linux-*.deb
            Lararium-linux-*.rpm
            Lararium-linux-*.tar.gz
          body_path: linux-notes.md
      - name: "The newest files under fixed links (the website's Download for Linux)"
        uses: softprops/action-gh-release@v3
        with:
          tag_name: linux
          name: Lararium for Linux (newest)
          make_latest: false
          overwrite_files: true
          files: |
            Lararium-linux.deb
            Lararium-linux.rpm
            Lararium-linux.tar.gz
          body_path: linux-notes.md
