# Builds the Mac app (desktop/) into a .dmg and publishes it as a release (not marked "latest", so the phone's
# in-app updates keep finding the APK). Needs two repository secrets for Google sign-in on the Mac:
#   MAC_GOOGLE_CLIENT_ID      the "Desktop app" OAuth client ID (same Google Cloud project as the phone)
#   MAC_GOOGLE_CLIENT_SECRET  its client secret
name: Build Mac app
on:
  push:
    branches: [main]
    paths:
      - "desktop/**"
      - "app/src/main/java/com/familydocs/app/domain/**"
      - "app/src/main/java/com/familydocs/app/data/Entities.kt"
      - "app/src/main/java/com/familydocs/app/ocr/FieldMerge.kt"
      - "app/src/main/java/com/familydocs/app/backup/BackupCrypto.kt"
      - "app/src/main/java/com/familydocs/app/backup/DriveClient.kt"
      - "app/src/main/java/com/familydocs/app/ui/ds/IconPaths.kt"
      - ".github/workflows/build-mac.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dmg:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v6
      - name: Build the .dmg
        env:
          MAC_GOOGLE_CLIENT_ID: ${{ secrets.MAC_GOOGLE_CLIENT_ID }}
          MAC_GOOGLE_CLIENT_SECRET: ${{ secrets.MAC_GOOGLE_CLIENT_SECRET }}
          MAC_VERSION: 1.0.${{ github.run_number }}
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew -p desktop --no-daemon packageDmg 2>&1 | tee build.log
      - name: Summarise build errors (shown on the run page, no sign-in needed)
        if: failure()
        run: |
          grep -E -A4 '^e: |What went wrong|FAILED|error:' build.log | head -150 > errs.txt || true
          [ -s errs.txt ] || tail -60 build.log > errs.txt
          echo "::error title=Build errors::$(sed 's/%/%25/g; s/\r//g' errs.txt | awk '{printf "%s%%0A", $0}')"
      - name: Name the .dmg
        run: |
          V=1.0.${{ github.run_number }}
          echo "V=$V" >> $GITHUB_ENV
          f=$(ls desktop/build/compose/binaries/main/dmg/*.dmg | head -1)
          cp "$f" "Lararium-mac-$V.dmg"; cp "$f" Lararium-mac.dmg
          { echo "Lararium for Mac $V (Apple silicon). View-only for now: everything in your vault, read from your encrypted Google Drive backup and your group's shares. Add and change things on the phone."
            echo
            echo "Install: open the .dmg and drag Lararium to Applications. The first time, macOS may say it can't check the app (it isn't from the App Store): open System Settings › Privacy & Security and click Open Anyway, or in Terminal run:"
            echo
            echo '    xattr -dr com.apple.quarantine /Applications/Lararium.app'
          } > mac-notes.md
      - uses: actions/upload-artifact@v7
        with:
          name: Lararium-mac
          path: Lararium-mac-*.dmg
      - name: "Publish (not as the latest release, which stays the phone APK)"
        uses: softprops/action-gh-release@v3
        with:
          tag_name: mac-v${{ env.V }}
          name: Lararium for Mac ${{ env.V }}
          make_latest: false
          files: |
            Lararium-mac-*.dmg
            Lararium-mac.dmg
          body_path: mac-notes.md
      - name: "The newest .dmg under a fixed link (the website's Download for Mac)"
        uses: softprops/action-gh-release@v3
        with:
          tag_name: mac
          name: Lararium for Mac (newest)
          make_latest: false
          overwrite_files: true
          files: Lararium-mac.dmg
          body_path: mac-notes.md
